name: QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check foundation
        run: npm run check:foundation
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check rendered routes
        run: npm run test:router
      - name: Check public CMS request ownership
        run: node scripts/public-cms-race.mjs --browser=chromium
